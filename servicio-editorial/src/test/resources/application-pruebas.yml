# =============================================================================
# Perfil "pruebas" (solo pruebas de integración con Testcontainers).
# CONTRATOS 9.3.6 (v1.10): la validación del esquema se comprueba en las pruebas, no al arrancar. En este perfil
# Flyway migra al iniciar el contexto y luego Hibernate valida las entidades JPA contra ese esquema; si una columna o
# un tipo no coincide, el contexto no arranca y las pruebas fallan.
# =============================================================================
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true
